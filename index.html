<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Distance Hearts Live 💕</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #ff6b9d;
      --pink-dark: #e84a7f;
      --purple: #9b59b6;
      --dark: #2d1b2e;
      --soft: #ffe0ec;
      --cream: #fff5f8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(160deg, #fff0f5, #f3e8ff 50%, #ffe4f0);
      min-height: 100vh;
      color: var(--dark);
    }
    .screen { display: none; min-height: 100vh; }
    .screen.active { display: block; }

    /* LOGIN */
    #loginScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      text-align: center;
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .tagline { color: #8a6a7a; margin-bottom: 30px; font-weight: 600; }
    .login-box {
      background: white;
      border-radius: 24px;
      padding: 28px 22px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 15px 40px rgba(255,107,157,0.15);
    }
    .login-box input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid var(--soft);
      border-radius: 14px;
      font-size: 1rem;
      font-family: inherit;
      margin-bottom: 12px;
      outline: none;
      text-align: center;
      font-weight: 700;
    }
    .login-box input:focus { border-color: var(--pink); }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-weight: 800;
      font-size: 1.05rem;
      color: white;
      cursor: pointer;
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      margin-top: 6px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-secondary {
      background: white;
      color: var(--pink);
      border: 2px solid var(--pink);
      margin-top: 10px;
    }
    .error { color: #e74c3c; font-size: 0.9rem; margin-top: 10px; font-weight: 700; }

    /* MAIN APP */
    #appScreen { padding-bottom: 80px; }
    header {
      background: white;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-title { font-weight: 800; font-size: 1.1rem; }
    .header-user { font-size: 0.85rem; color: #8a6a7a; }
    .logout-btn {
      background: var(--soft);
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--pink-dark);
    }

    .tabs {
      display: flex;
      gap: 6px;
      padding: 12px 12px 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0;
      padding: 9px 16px;
      border-radius: 50px;
      background: white;
      border: none;
      font-weight: 700;
      font-size: 0.85rem;
      color: #8a6a7a;
      box-shadow: 0 3px 10px rgba(0,0,0,0.04);
    }
    .tab.active {
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      color: white;
    }

    .panel { display: none; padding: 16px; }
    .panel.active { display: block; }

    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(255,107,157,0.12);
      margin-bottom: 16px;
    }
    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      text-align: center;
      margin-bottom: 6px;
    }
    .card-sub { text-align: center; font-size: 0.85rem; color: #9a7a8a; margin-bottom: 16px; }

    .modes { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 16px; }
    .mode-btn {
      padding: 7px 13px;
      border-radius: 50px;
      border: 2px solid var(--soft);
      background: white;
      font-weight: 700;
      font-size: 0.8rem;
      color: #7a5a6a;
    }
    .mode-btn.active { background: var(--pink); color: white; border-color: var(--pink); }
    .mode-btn.spicy { background: linear-gradient(135deg,#e74c3c,#c0392b); border-color: #c0392b; color: white; }

    .result-box {
      background: linear-gradient(145deg,#fff5f9,#f8f0ff);
      border-radius: 16px;
      padding: 22px 16px;
      min-height: 120px;
      text-align: center;
      border: 2px dashed var(--pink);
      margin-bottom: 14px;
      position: relative;
    }
    .result-label { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--pink); margin-bottom: 8px; }
    .result-text { font-size: 1.1rem; font-weight: 700; line-height: 1.4; }
    .result-type {
      position: absolute; top: 10px; right: 12px;
      font-size: 0.7rem; background: var(--pink); color: white;
      padding: 3px 9px; border-radius: 20px; font-weight: 700;
    }

    .btn-row { display: flex; gap: 10px; margin-bottom: 12px; }
    .btn-sm {
      flex: 1; padding: 13px; border: none; border-radius: 12px;
      font-weight: 800; font-size: 0.95rem; color: white; cursor: pointer;
    }
    .btn-truth { background: linear-gradient(135deg,#6c5ce7,#a29bfe); }
    .btn-dare { background: linear-gradient(135deg,var(--pink),var(--pink-dark)); }
    .btn-random { background: linear-gradient(135deg,var(--purple),#8e44ad); width: 100%; }

    /* ANSWER */
    .answer-area { margin-top: 14px; }
    .answer-area textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--soft);
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      resize: none;
      min-height: 70px;
      outline: none;
    }
    .answer-area textarea:focus { border-color: var(--pink); }
    .answers-list { margin-top: 14px; }
    .answer-item {
      background: var(--cream);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      font-size: 0.92rem;
    }
    .answer-item strong { color: var(--pink-dark); }

    /* CHAT */
    #chatBox {
      height: 320px;
      overflow-y: auto;
      background: #fafafa;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.92rem;
      line-height: 1.35;
    }
    .msg.me {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      color: white;
      border-bottom-right-radius: 4px;
    }
    .msg.them {
      align-self: flex-start;
      background: white;
      border: 1px solid #eee;
      border-bottom-left-radius: 4px;
    }
    .msg .name { font-size: 0.7rem; font-weight: 800; opacity: 0.8; margin-bottom: 2px; }
    .chat-input-row { display: flex; gap: 8px; }
    .chat-input-row input {
      flex: 1;
      padding: 12px 14px;
      border: 2px solid var(--soft);
      border-radius: 12px;
      font-family: inherit;
      outline: none;
    }
    .chat-input-row button {
      padding: 0 18px;
      border: none;
      border-radius: 12px;
      background: var(--pink);
      color: white;
      font-weight: 800;
    }

    .status-bar {
      text-align: center;
      font-size: 0.8rem;
      color: #27ae60;
      font-weight: 700;
      padding: 6px;
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="screen active">
    <div class="logo">Distance Hearts 💕</div>
    <div class="tagline">Play & chat together in real time</div>
    <div class="login-box">
      <input type="text" id="usernameInput" placeholder="Your name" maxlength="15">
      <input type="text" id="roomInput" placeholder="Room code (e.g. LOVE23)" maxlength="8" style="text-transform:uppercase">
      <button class="btn" onclick="joinRoom()">Join Room</button>
      <button class="btn btn-secondary" onclick="createRoom()">Create New Room</button>
      <div class="error" id="loginError"></div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="appScreen" class="screen">
    <header>
      <div>
        <div class="header-title">Distance Hearts</div>
        <div class="header-user" id="headerUser">—</div>
      </div>
      <button class="logout-btn" onclick="logout()">Leave</button>
    </header>

    <div class="status-bar" id="statusBar">Connected 💕</div>

    <div class="tabs">
      <button class="tab active" data-panel="games">Games</button>
      <button class="tab" data-panel="chat">Chat</button>
      <button class="tab" data-panel="answers">Answers</button>
    </div>

    <!-- GAMES PANEL -->
    <div class="panel active" id="games">
      <div class="card">
        <div class="card-title">Truth or Dare</div>
        <div class="card-sub">Both of you see the same question</div>

        <div class="modes" id="modes">
          <button class="mode-btn active" data-mode="soft">Soft</button>
          <button class="mode-btn" data-mode="flirty">Flirty</button>
          <button class="mode-btn" data-mode="spicy">Spicy</button>
          <button class="mode-btn" data-mode="deep">Deep</button>
        </div>

        <div class="result-box" id="questionBox">
          <div class="result-label">Ready</div>
          <div class="result-text">Tap a button to get a question</div>
        </div>

        <div class="btn-row">
          <button class="btn-sm btn-truth" onclick="drawQuestion('truth')">Truth</button>
          <button class="btn-sm btn-dare" onclick="drawQuestion('dare')">Dare</button>
        </div>
        <button class="btn-sm btn-random" onclick="drawQuestion('random')">Random 🎲</button>

        <div class="answer-area">
          <textarea id="answerInput" placeholder="Type your answer here..."></textarea>
          <button class="btn" style="margin-top:8px" onclick="submitAnswer()">Send Answer 💕</button>
        </div>
      </div>
    </div>

    <!-- CHAT PANEL -->
    <div class="panel" id="chat">
      <div class="card">
        <div class="card-title">Live Chat</div>
        <div id="chatBox"></div>
        <div class="chat-input-row">
          <input type="text" id="chatInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendChat()">
          <button onclick="sendChat()">Send</button>
        </div>
      </div>
    </div>

    <!-- ANSWERS PANEL -->
    <div class="panel" id="answers">
      <div class="card">
        <div class="card-title">Shared Answers</div>
        <div class="card-sub">Answers from both of you appear here</div>
        <div class="answers-list" id="answersList">
          <div style="text-align:center;color:#aaa;padding:20px">No answers yet</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ========== FIREBASE CONFIG ==========
    const firebaseConfig = {
      apiKey: "AIzaSyAycyGHXMWL-wvVkiaRh8BNJKZHTYEP3ew",
      authDomain: "distancehearts.firebaseapp.com",
      databaseURL: "https://distancehearts-default-rtdb.firebaseio.com",
      projectId: "distancehearts",
      storageBucket: "distancehearts.firebasestorage.app",
      messagingSenderId: "792287007634",
      appId: "1:792287007634:web:1f32647d95a27e38bc674b"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ========== STATE ==========
    let username = "";
    let roomCode = "";
    let currentMode = "soft";
    let currentQuestion = "";

    // ========== QUESTIONS ==========
    const TOD = {
      soft: {
        truth: [
          "What’s one small thing I do that always makes you smile?",
          "What’s your favorite memory of us so far?",
          "What song instantly makes you think of me?",
          "What’s something you’re looking forward to doing together?",
          "What’s the cutest thing I’ve ever said to you?",
          "If we could teleport for one hour right now, what would we do?",
          "What’s one thing about long distance that has made us stronger?",
          "When do you feel closest to me even though we’re apart?",
          "What’s the best compliment you’ve ever received from me?",
          "What’s a random moment from our chats that still makes you laugh?"
        ],
        dare: [
          "Send a voice note saying three things you love about me.",
          "Take a selfie right now and describe it.",
          "Do your best impression of me for 15 seconds.",
          "Write a short 3-line poem about us.",
          "Show me the view from your window.",
          "Sing the chorus of a song that reminds you of us.",
          "Make the silliest face you can.",
          "Tell me a joke (even a bad one)."
        ]
      },
      flirty: {
        truth: [
          "What’s the first thing you’d do if I walked through your door right now?",
          "What’s a compliment you’ve been holding back?",
          "When was the last time you thought about kissing me?",
          "What’s one outfit of mine you secretly love?",
          "What’s the most attractive thing about my personality?",
          "Have you ever dreamed about me? Tell me.",
          "What’s something flirty you’ve wanted to say?",
          "Which of my features do you stare at most on calls?"
        ],
        dare: [
          "Send a voice note in your most seductive voice.",
          "Blow a kiss to the camera.",
          "Describe exactly how you’d greet me at the airport.",
          "Write a flirty text as if we just started dating.",
          "Tell me three things you’d whisper in my ear.",
          "Give me your best ‘come here’ look."
        ]
      },
      spicy: {
        truth: [
          "What’s a fantasy involving us that you’ve thought about lately?",
          "What’s the hottest memory you have of us?",
          "What’s one thing you’d love to try when we’re together again?",
          "What’s something I do that turns you on without trying?",
          "If we had one night with no rules, what would you want?",
          "What’s a secret desire you’ve never told me?",
          "Describe the first 10 minutes after we reunite.",
          "What’s the naughtiest thought you’ve had about me this week?",
          "Have you ever touched yourself while thinking about me?",
          "What’s your biggest turn-on on a video call?"
        ],
        dare: [
          "Describe what you’d do if I was lying next to you right now.",
          "Tell me your current fantasy in detail.",
          "Whisper three dirty things you’d say to me.",
          "Rate how much you’re missing the physical side from 1–10.",
          "Describe the outfit (or lack of) you’d want me in when I arrive.",
          "Tell me step-by-step what you would do to me for 30 minutes.",
          "Send a voice note moaning my name once.",
          "Describe exactly how you want to be kissed."
        ]
      },
      deep: {
        truth: [
          "What’s something about the distance that still scares you?",
          "What’s one sacrifice you’ve made for us that I might not see?",
          "When do you feel most secure in our relationship?",
          "What’s a fear you have about our future?",
          "How has long distance changed the way you love?",
          "What’s one thing you need more of from me right now?",
          "What’s a moment you almost gave up — and what made you stay?",
          "What does ‘home’ mean to you when we’re apart?"
        ],
        dare: [
          "Tell me one thing you’re grateful for about us today.",
          "Look into the camera for 20 seconds without speaking.",
          "Tell me about a hard day and how you wished I was there.",
          "Say out loud one insecurity and let me respond.",
          "Describe the version of us you’re fighting for.",
          "Tell me why you still choose us every day."
        ]
      }
    };

    // ========== LOGIN ==========
    function createRoom() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let code = "";
      for (let i = 0; i < 5; i++) code += chars[Math.floor(Math.random() * chars.length)];
      document.getElementById("roomInput").value = code;
      joinRoom();
    }

    function joinRoom() {
      const name = document.getElementById("usernameInput").value.trim();
      const room = document.getElementById("roomInput").value.trim().toUpperCase();
      const err = document.getElementById("loginError");

      if (name.length < 2) { err.textContent = "Enter a name (at least 2 letters)"; return; }
      if (room.length < 3) { err.textContent = "Enter a room code (at least 3 characters)"; return; }

      username = name;
      roomCode = room;

      // Write presence
      db.ref("rooms/" + roomCode + "/users/" + username).set({
        name: username,
        joined: Date.now()
      });

      // Start listeners
      listenChat();
      listenAnswers();
      listenQuestion();

      document.getElementById("headerUser").textContent = username + " • Room " + roomCode;
      document.getElementById("loginScreen").classList.remove("active");
      document.getElementById("appScreen").classList.add("active");
    }

    function logout() {
      if (roomCode && username) {
        db.ref("rooms/" + roomCode + "/users/" + username).remove();
      }
      location.reload();
    }

    // ========== TABS ==========
    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById(tab.dataset.panel).classList.add("active");
      });
    });

    // ========== MODES ==========
    document.querySelectorAll(".mode-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active", "spicy"));
        btn.classList.add("active");
        if (btn.dataset.mode === "spicy") btn.classList.add("spicy");
        currentMode = btn.dataset.mode;
      });
    });

    // ========== QUESTIONS ==========
    function drawQuestion(type) {
      let finalType = type;
      if (type === "random") finalType = Math.random() < 0.5 ? "truth" : "dare";
      const list = TOD[currentMode][finalType];
      const q = list[Math.floor(Math.random() * list.length)];
      currentQuestion = q;

      // Share the question with the room
      db.ref("rooms/" + roomCode + "/currentQuestion").set({
        text: q,
        type: finalType,
        mode: currentMode,
        by: username,
        time: Date.now()
      });
    }

    function listenQuestion() {
      db.ref("rooms/" + roomCode + "/currentQuestion").on("value", snap => {
        const data = snap.val();
        if (!data) return;
        currentQuestion = data.text;
        document.getElementById("questionBox").innerHTML = `
          <div class="result-type">${data.type.toUpperCase()}</div>
          <div class="result-label">${data.mode} • by ${data.by}</div>
          <div class="result-text">${data.text}</div>
        `;
      });
    }

    // ========== ANSWERS ==========
    function submitAnswer() {
      const text = document.getElementById("answerInput").value.trim();
      if (!text) return;
      if (!currentQuestion) {
        alert("Get a question first!");
        return;
      }

      const key = db.ref("rooms/" + roomCode + "/answers").push().key;
      db.ref("rooms/" + roomCode + "/answers/" + key).set({
        user: username,
        question: currentQuestion,
        answer: text,
        time: Date.now()
      });

      document.getElementById("answerInput").value = "";
    }

    function listenAnswers() {
      db.ref("rooms/" + roomCode + "/answers").on("value", snap => {
        const data = snap.val() || {};
        const list = document.getElementById("answersList");
        const items = Object.values(data).sort((a,b) => b.time - a.time);

        if (items.length === 0) {
          list.innerHTML = `<div style="text-align:center;color:#aaa;padding:20px">No answers yet</div>`;
          return;
        }

        list.innerHTML = items.map(item => `
          <div class="answer-item">
            <strong>${item.user}</strong> answered:<br>
            <em style="color:#888;font-size:0.85rem">${item.question}</em><br>
            ${item.answer}
          </div>
        `).join("");
      });
    }

    // ========== CHAT ==========
    function sendChat() {
      const input = document.getElementById("chatInput");
      const text = input.value.trim();
      if (!text) return;

      const key = db.ref("rooms/" + roomCode + "/chat").push().key;
      db.ref("rooms/" + roomCode + "/chat/" + key).set({
        user: username,
        text: text,
        time: Date.now()
      });
      input.value = "";
    }

    function listenChat() {
      db.ref("rooms/" + roomCode + "/chat").on("value", snap => {
        const data = snap.val() || {};
        const box = document.getElementById("chatBox");
        const items = Object.values(data).sort((a,b) => a.time - b.time);

        box.innerHTML = items.map(msg => `
          <div class="msg ${msg.user === username ? 'me' : 'them'}">
            <div class="name">${msg.user}</div>
            ${msg.text}
          </div>
        `).join("");

        box.scrollTop = box.scrollHeight;
      });
    }
  </script>
</body>
</html>
